<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="setup-screen" class="screen">
  <div class="setup-box">
    <h1 class="title">UNO</h1>
    <p class="subtitle">いっしょに あそぶ ロボットの かずを えらんでね</p>
    <div class="opponent-select" id="opponent-select">
      <button class="opt-btn" data-count="1">1にん</button>
      <button class="opt-btn" data-count="2">2にん</button>
      <button class="opt-btn selected" data-count="3">3にん</button>
    </div>
    <button id="start-btn" class="primary-btn">スタート！</button>
    <a href="rules.html" class="rules-link" target="_blank" rel="noopener">あそびかたを みてみよう</a>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="opponents-area"></div>

  <div id="table-area">
    <div id="log-box"></div>
    <div id="center-area">
      <div id="draw-pile" class="pile">
        <div class="card card-back"></div>
        <div id="draw-count" class="pile-count">0</div>
      </div>
      <div id="discard-pile" class="pile">
        <div id="current-color-ring"></div>
      </div>
    </div>
  </div>

  <div id="player-area">
    <div id="player-info">
      <span id="turn-indicator"></span>
      <button id="uno-btn" class="uno-btn hidden">UNO!</button>
    </div>
    <div id="player-hand"></div>
    <div id="player-controls">
      <button id="draw-btn" class="secondary-btn">カードを ひく</button>
      <button id="pass-btn" class="secondary-btn hidden">パス</button>
      <button id="newgame-btn" class="secondary-btn">さいしょから</button>
      <a href="rules.html" class="secondary-btn rules-link-ingame" target="_blank" rel="noopener">あそびかた</a>
    </div>
  </div>
</div>

<div id="color-modal" class="modal hidden">
  <div class="modal-box">
    <p>いろを えらんでね</p>
    <div class="color-choice">
      <button class="color-btn" data-color="red"></button>
      <button class="color-btn" data-color="yellow"></button>
      <button class="color-btn" data-color="green"></button>
      <button class="color-btn" data-color="blue"></button>
    </div>
  </div>
</div>

<div id="result-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="result-text"></h2>
    <button id="result-newgame-btn" class="primary-btn">もういっかい あそぶ</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
